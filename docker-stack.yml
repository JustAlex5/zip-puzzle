# ========== Docker Swarm (primary deployment) ==========
#
# Prereq: swarm mode on the manager (`docker swarm init` once per cluster).
#
# 1) Images on every node that will run the stack — either:
#    - Push/pull from Docker Hub (version tag, not latest):
#        .\scripts\dockerhub-build-push.ps1 -Username "<hub_user>" -Push
#      On nodes: same DOCKERHUB_USER + TAG when deploying, or
#    - Build locally on each node / in CI then deploy:
#        .\scripts\build-stack-images.ps1 -Username "<hub_user>"
#      (tag defaults from repo VERSION file)
#
# 2) Deploy / update stack (PowerShell example):
#        $env:DOCKERHUB_USER="<hub_user>"
#        $env:TAG="1.0.2"   # must match image tag you built/pushed
#        docker stack deploy -c docker-stack.yml zip-puzzle
#
#    Bash:
#        export DOCKERHUB_USER="<hub_user>"
#        export TAG="1.0.2"
#        docker stack deploy -c docker-stack.yml zip-puzzle
#
#    Optional: `docker stack deploy --with-registry-auth ...` if workers pull private Hub repos.
#
# 3) Operate:
#        docker stack services zip-puzzle
#        docker stack ps zip-puzzle
#        docker stack rm zip-puzzle
#
# Env vars: POSTGRES_PASSWORD, HTTP_PORT, JWT_SECRET, CORS_ORIGINS, TAG, DOCKERHUB_USER (see .env.example).
# When you bump VERSION, update the TAG:- defaults on api/gateway images below or always set TAG at deploy time.
#
# HTTPS / Let's Encrypt (Swarm): see Frontend/zip-angular/docker/gateway.tls.example.conf and
#   deploy/docker-stack.gateway-tls.yml — second file merges gateway (443 + bind certs + Nginx config).
# Set CORS_ORIGINS=https://your-host and optional HTTPS_PORT (default 443).
#
# docker-compose.yml in this repo is for optional laptop dev only, not Swarm.

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zipgame_dev}
      POSTGRES_DB: zipgame
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:-5432}
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  redis:
    image: redis:7-alpine
    networks:
      - app
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  # Default tag matches repo VERSION file; set TAG when deploying if you bumped VERSION.
  api:
    image: ${DOCKERHUB_USER:-local}/zip-puzzle-api:${TAG:-1.0.2}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DISABLE_HTTPS_REDIRECTION: "true"
      # Swarm: use tasks.<service> so embedded DNS resolves (short names like "postgres" can fail with "Name or service not known").
      ConnectionStrings__DefaultConnection: >-
        Host=tasks.postgres;Port=5432;Database=zipgame;Username=postgres;Password=${POSTGRES_PASSWORD:-zipgame_dev}
      Redis__ConnectionString: tasks.redis:6379
      Jwt__Secret: ${JWT_SECRET:-your-super-secret-key-min-32-characters-long-docker}
      Jwt__Issuer: zip-puzzle
      Jwt__Audience: zip-puzzle-users
      Cors__Origins: ${CORS_ORIGINS:-http://localhost}
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
    networks:
      - app
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  gateway:
    image: ${DOCKERHUB_USER:-local}/zip-puzzle-gateway:${TAG:-1.0.2}
    networks:
      - app
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first

networks:
  app:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
