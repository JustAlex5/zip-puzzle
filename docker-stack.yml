# Docker Swarm stack — build images first, then deploy:
#   docker swarm init
#   .\scripts\build-stack-images.ps1 -Username justalex5
#   $env:DOCKERHUB_USER="your-dockerhub-user"; $env:TAG="latest"; docker stack deploy -c docker-stack.yml zip-puzzle
#
# Docker Hub: create repos <user>/zip-puzzle-api and <user>/zip-puzzle-gateway, then:
#   .\scripts\dockerhub-build-push.ps1 -Username "your-dockerhub-user" -Push
#   (same DOCKERHUB_USER + TAG when deploying so workers pull the right images)
#
# DOCKERHUB_USER defaults to "local" in build scripts if unset (local-only image names).
# Only PostgreSQL and the HTTP gateway publish host ports (see deploy). Redis and API stay on the overlay network.

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zipgame_dev}
      POSTGRES_DB: zipgame
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:-5432}
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  redis:
    image: redis:7-alpine
    networks:
      - app
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  api:
    image: ${DOCKERHUB_USER:-local}/zip-puzzle-api:${TAG:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DISABLE_HTTPS_REDIRECTION: "true"
      # Swarm: use tasks.<service> so embedded DNS resolves (short names like "postgres" can fail with "Name or service not known").
      ConnectionStrings__DefaultConnection: >-
        Host=tasks.postgres;Port=5432;Database=zipgame;Username=postgres;Password=${POSTGRES_PASSWORD:-zipgame_dev}
      Redis__ConnectionString: tasks.redis:6379
      Jwt__Secret: ${JWT_SECRET:-your-super-secret-key-min-32-characters-long-docker}
      Jwt__Issuer: zip-puzzle
      Jwt__Audience: zip-puzzle-users
      Cors__Origins: ${CORS_ORIGINS:-http://localhost}
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
    networks:
      - app
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  gateway:
    image: ${DOCKERHUB_USER:-local}/zip-puzzle-gateway:${TAG:-latest}
    networks:
      - app
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first

networks:
  app:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
