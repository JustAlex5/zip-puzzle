# Build and push API + gateway to Docker Hub on main/master.
# Tags:  <VERSION>-<run_id>  and  <run_id>  (traceable); also <VERSION> for convenience.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN   (Docker Hub password or access token)
#
# Bump VERSION at repo root before shipping a semver line; run_id stays unique per workflow run.

name: Release Docker images

on:
  push:
    branches: [main, master]

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        run: |
          V=$(tr -d ' \t\r\n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "BUILDING version=$V run_id=${{ github.run_id }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: Backend/Zip.Service/Zip.Service
          file: Backend/Zip.Service/Zip.Service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/zip-puzzle-api:${{ steps.ver.outputs.version }}-${{ github.run_id }}
            ${{ secrets.DOCKERHUB_USERNAME }}/zip-puzzle-api:${{ github.run_id }}
            ${{ secrets.DOCKERHUB_USERNAME }}/zip-puzzle-api:${{ steps.ver.outputs.version }}

      - name: Build & push Gateway
        uses: docker/build-push-action@v6
        with:
          context: Frontend/zip-angular
          file: Frontend/zip-angular/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/zip-puzzle-gateway:${{ steps.ver.outputs.version }}-${{ github.run_id }}
            ${{ secrets.DOCKERHUB_USERNAME }}/zip-puzzle-gateway:${{ github.run_id }}
            ${{ secrets.DOCKERHUB_USERNAME }}/zip-puzzle-gateway:${{ steps.ver.outputs.version }}

      - name: Summary
        run: |
          echo "### Published tags" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`zip-puzzle-api:${{ steps.ver.outputs.version }}-${{ github.run_id }}\`, \`:${{ github.run_id }}\`, \`:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`zip-puzzle-gateway:${{ steps.ver.outputs.version }}-${{ github.run_id }}\`, \`:${{ github.run_id }}\`, \`:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
