<section class="retro" aria-label="Hidden retro game">
  <div class="lcd-frame">
    <div class="lcd-title">SNAKE · classic</div>
    <canvas #canvas class="lcd-canvas" role="img" aria-label="Snake game grid"></canvas>
    <div class="lcd-hud">
      <span>score {{ score }}</span>
      <span class="hud-hint">arrows · P pause</span>
    </div>
  </div>
  <p class="retro-foot">
    <a routerLink="/" class="retro-back">← back to ZIP</a>
  </p>
</section>
