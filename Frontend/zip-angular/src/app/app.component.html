<div class="app-shell">
  <header class="app-header">
    <div class="app-title">zip</div>
    <div class="app-tagline">path through numbers in order</div>
    <nav class="tab-bar">
      <a routerLink="/play" routerLinkActive="active">play</a>
      <a routerLink="/editor" routerLinkActive="active">level editor</a>
    </nav>
    <div class="auth-bar">
      @if (auth.username(); as name) {
        <span class="user-label">{{ name }}</span>
        <button type="button" class="linkish" (click)="logout()">log out</button>
      } @else {
        <a routerLink="/login" class="linkish">log in</a>
        <a routerLink="/register" class="linkish">register</a>
      }
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
