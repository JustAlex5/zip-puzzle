# TLS gateway for Docker Swarm + Let's Encrypt on the host.
# Copy beside your stack file (e.g. gateway.tls.conf), edit server_name + cert paths, then:
#   docker stack deploy -c docker-stack.yml -c docker-stack.gateway-tls.yml zip-puzzle
# See deploy/docker-stack.gateway-tls.yml for the gateway service + secrets/config merge.
#
# Requirements:
# - Same `$forwarded_proto` map as docker/nginx.conf (already in the gateway image).
# - CORS_ORIGINS must use https://<your-host> (no trailing slash).

upstream api_upstream {
    server api:8080;
}

server {
    listen 80;
    server_name zipgame.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zipgame.duckdns.org;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/zipgame.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zipgame.duckdns.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # add_header Strict-Transport-Security "max-age=31536000" always;

    location /hubs/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location /auth {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
    }

    location /levels {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
